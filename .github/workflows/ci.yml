name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # เทสต์ทั้งหมดเป็น pure function ไม่แตะฐานข้อมูล แต่ client.ts อ่าน env ตอน import
      # จึงใส่ค่า dummy ไว้ให้ผ่านขั้น module evaluation
      TURSO_DATABASE_URL: "file:./ci.db"
      # ตรึง timezone ให้ตรงกับ production ไม่งั้นเทสต์วันเวลาจะเปลี่ยนผลตาม runner
      TZ: Asia/Bangkok

    steps:
      - uses: actions/checkout@v4

      # ★ ต้องเป็นเวอร์ชันเดียวกับที่ใช้เขียน package-lock.json ไม่ใช่ "เวอร์ชันที่ยังซัพพอร์ตอยู่"
      #
      #   ของเดิมตั้งไว้ที่ 22 (มากับ npm 10) ส่วนเครื่องที่พัฒนาใช้ 24 (npm 11)
      #   npm 11 เขียน lock file ในแบบที่ npm 10 คำนวณ tree ออกมาไม่ตรงกัน แล้ว npm ci
      #   ซึ่งยึด lock เป๊ะๆ จะปฏิเสธทันที ("Missing: esbuild@... from lock file")
      #   ทั้งที่ npm install ในเครื่องผ่านสบาย เพราะมันยอมแก้ tree ให้เอง
      #
      #   กับดักคือมันพังทุกครั้งที่มีคนรัน npm install ในเครื่องแล้ว commit lock ขึ้นมา
      #   ตรึงให้ตรงกันเสียเลยจึงตัดปัญหาที่ต้นเหตุ ไม่ใช่ไล่ตามแก้ lock ทุกรอบ
      #   (Node 24 เป็น LTS และ Vercel รองรับทั้ง build และ function แล้ว)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci ไม่ใช่ npm install โดยตั้งใจ — ต้องติดตั้งตามที่ lock บอกเป๊ะๆ
      # ไม่งั้น CI จะทดสอบชุด dependency คนละชุดกับที่ deploy จริง
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # build ต้องอยู่ใน CI ด้วย ไม่ใช่แค่ lint/typecheck/test
      #
      # tsc ตรวจ type แต่ไม่ได้ตรวจว่า Next ประกอบร่างได้จริง เรื่องที่หลุดได้คือ
      # การ import ข้ามฝั่ง server/client, การใช้ dynamic API ในหน้าที่ถูก prerender,
      # และ config ที่พังเฉพาะตอน build ซึ่งทั้งหมดจะไปโผล่ตอน deploy แทน
      #
      # ใช้ env ชุดเดียวกับ test ด้านบนได้เลย ยืนยันแล้วว่า build ผ่านโดยไม่ต้องมี
      # BETTER_AUTH_SECRET หรือ token จริง
      - run: npm run build
